plugins {
    id 'fabric-loom' version "${loom_version}"
}

repositories {
    maven { name = "MinecraftLibraries"; url = "https://libraries.minecraft.net/" }
    maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "voxy-exclusion-zones-refmap.json"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile against Voxy but keep it as a separately installed mod.
    modCompileOnly "maven.modrinth:${project.voxy_project_id}:${project.voxy_version}"
    modCompileOnly "maven.modrinth:${project.sodium_project_id}:${project.sodium_version}"

    // Mixin annotation processor for remapped injection targets.
    annotationProcessor "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version,
            voxy_mod_version: project.voxy_mod_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
